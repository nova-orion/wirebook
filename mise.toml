[tools]
go = "latest"

[tasks.check]
description = "Validate the inventory graph"
run = "go run ./cmd/inv validate"

[tasks.free]
description = "List unplugged ports, and blocked ones with reasons"
run = "go run ./cmd/inv free"

[tasks.fmt]
description = "Rewrite inventory.yaml in canonical form"
run = "go run ./cmd/inv fmt -w"

[tasks.test]
description = "Full suite: Go vet/build/tests, JS tests, real browser, emitter sweep"
run = [
  "go vet ./cmd/inv",
  "go build -o /dev/null ./cmd/inv",
  "go test ./...",
  "node test/core.test.mjs",
  "node test/ui.test.mjs",
  # Needs `npm run setup` once. The stub DOM above cannot see a layout, style or
  # event-ordering bug, and all four of those shipped to a user.
  "node test/browser.test.mjs",
  "node test/sweep.mjs",
]

[tasks.browser]
description = "Real Chromium tests (npm run setup first)"
run = "node test/browser.test.mjs"

[tasks.explore]
description = "Exploratory crawler: clicks everything, types hostile values, checks invariants"
run = "node test/explore.mjs --keep-going"

[tasks.sweep]
description = "Exhaustive scalar-quoting parity check against `inv fmt`"
run = "node test/sweep.mjs"
