name: pages

# Publishes the editor to GitHub Pages. Free on a public repo; on a private repo
# Pages needs GitHub Pro or higher.
#
# Before enabling this, set Settings > Pages > Source to "GitHub Actions".
#
# Only the app is published. inventory.yaml is deliberately NOT copied into the
# site: the editor reads your inventory from your own disk through the File
# System Access API and never uploads it, so there is no reason for a copy to sit
# on a public URL. If your inventory is committed to a public repo it is already
# readable there, which is a separate decision worth making on purpose.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # Never publish a build that fails its own parity check.
      # The sweep shells out to `go run ./cmd/inv`, so the module has to be
      # present before the tests run rather than as a side effect of an earlier step.
      - run: go mod download

      - name: verify before publishing
        run: |
          node test/core.test.mjs
          node test/sweep.mjs

      - name: assemble site
        run: |
          set -eu
          mkdir -p site
          cp index.html settings.yaml README.md site/
          cp -r css js third_party schema site/

          # Verify every asset index.html references actually made it. This step
          # silently shipped a site with no css or js when the single file was
          # split into css/ and js/, so the list is now checked, not trusted.
          missing=0
          for a in $(grep -oE '(src|href)="[^"]+"' index.html | cut -d'"' -f2); do
            case "$a" in http*|//*|\#*) continue ;; esac
            if [ -f "site/$a" ]; then echo "  ok      $a"
            else echo "  MISSING $a"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "::error::the site is missing referenced assets"; exit 1; }
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
