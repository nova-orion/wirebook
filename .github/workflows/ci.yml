name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: gofmt
        run: |
          out=$(gofmt -l cmd/)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - run: go vet ./cmd/inv
      - run: go build ./...

      # Runs js/core.js under node, so the model logic is covered without a browser.
      - name: unit tests
        run: node test/core.test.mjs

      # Actually executes the UI against a stubbed DOM. The compile-only check
      # this replaced could not see a ReferenceError, and one was live.
      - name: ui smoke tests
        run: node test/ui.test.mjs

      # The stub DOM cannot dispatch real events, compute a style or lay anything
      # out, and it passed happily while the shipped app deleted every meta field
      # the moment you added one, panned the graph at a sixth of pointer speed,
      # printed "cpu null" in the tree and drew links in unreadable UA blue.
      # Real Chromium is the only thing that sees those, so it gates the build.
      - name: install browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: browser tests
        run: node test/browser.test.mjs

      # The one that matters: the Go emitter and the browser emitter must produce
      # byte-identical YAML, or saving from the editor reformats the whole file
      # and every diff becomes noise. This shells out to `inv fmt` for real.
      - name: emitter parity sweep
        run: node test/sweep.mjs

      # The inventory in the repo must already be canonical, so a hand-edit that
      # skipped `inv fmt` cannot land.
      # inventory.yaml is gitignored on purpose: it is the user's data and this
      # repo is public. The shipped example is what gets checked.
      - name: example inventory is canonical and valid
        run: |
          go run ./cmd/inv fmt inventory.example.yaml | diff -u - inventory.example.yaml
          go run ./cmd/inv validate inventory.example.yaml
          go run ./cmd/inv free inventory.example.yaml
          # the worked example ships to users, so it must stay canonical and load.
          # It carries one deliberate warning, hence `validate || true`: a warning
          # is not fatal and the point of it is to show what a warning looks like.
          go run ./cmd/inv fmt inventory.demo.yaml | diff -u - inventory.demo.yaml
          go run ./cmd/inv validate inventory.demo.yaml || true
          go run ./cmd/inv free inventory.demo.yaml > /dev/null
