name: docker

# Builds the static-hosting image and pushes it to GHCR, for running the editor
# on a cluster instead of opening the file locally.
#
# Note the app needs a SECURE CONTEXT for the File System Access API, so serve it
# over TLS (or via kubectl port-forward to localhost). Over plain http on a LAN
# address the editor cannot open or save your file in place.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # Do not ship an image whose emitter disagrees with the CLI.
      # The sweep shells out to `go run ./cmd/inv`, so the module has to be
      # present before the tests run rather than as a side effect of an earlier step.
      - run: go mod download

      - name: verify before building
        run: |
          node test/core.test.mjs
          node test/sweep.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Static check on the build inputs rather than introspecting a built
      # image. Two attempts at the latter were flaky in CI and blocked the image
      # for no security gain: nothing can be baked in that the Dockerfile does
      # not COPY, so checking the Dockerfile and .dockerignore proves the same
      # property deterministically and without a container.
      - name: no inventory can reach the image
        run: |
          set -eu
          if grep -nE '^\s*COPY.*inventory\.yaml' Dockerfile; then
            echo "::error::Dockerfile copies an inventory into the image"; exit 1
          fi
          grep -qE '^/?inventory\.yaml$' .dockerignore || {
            echo "::error::.dockerignore does not exclude inventory.yaml"; exit 1; }
          for want in index.html settings.yaml css/ js/ third_party/ schema/; do
            grep -qE "^\s*COPY.*[[:space:]]$want" Dockerfile || {
              echo "::error::Dockerfile does not COPY $want"; exit 1; }
          done
          echo "inventory excluded, app files copied"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
