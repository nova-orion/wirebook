name: docker

# Builds the static-hosting image and pushes it to GHCR, for running the editor
# on a cluster instead of opening the file locally.
#
# Note the app needs a SECURE CONTEXT for the File System Access API, so serve it
# over TLS (or via kubectl port-forward to localhost). Over plain http on a LAN
# address the editor cannot open or save your file in place.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # Do not ship an image whose emitter disagrees with the CLI.
      # The sweep shells out to `go run ./cmd/inv`, so the module has to be
      # present before the tests run rather than as a side effect of an earlier step.
      - run: go mod download

      - name: verify before building
        run: |
          node test/core.test.mjs
          node test/sweep.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build one arch into the local daemon first so the contents can be
      # inspected. A pushed multi-arch manifest is not present locally, so the
      # obvious `docker create` on the pushed tag would have to pull it back and
      # picks an arbitrary arch; loading here is both faster and deterministic.
      - name: build for inspection
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wirebook:inspect
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Baking an inventory in would leak the whole homelab topology.
      # .dockerignore excludes it; this proves it rather than trusting it.
      - name: image contains the app and no inventory
        run: |
          set -u
          files=$(docker run --rm --entrypoint sh wirebook:inspect \
                    -c 'find /usr/share/nginx/html -type f | sort')
          echo "$files"

          # Baking an inventory in would leak the whole homelab topology.
          if printf '%s\n' "$files" | grep -qE '/inventory\.yaml$'; then
            echo "::error::an inventory is baked into the image"; exit 1
          fi

          # And the opposite failure: an image that ships but is missing the app.
          for want in index.html settings.yaml css/wirebook.css js/core.js js/app.js \
                      third_party/js-yaml.min.js; do
            printf '%s\n' "$files" | grep -q "/usr/share/nginx/html/$want$" || {
              echo "::error::$want is missing from the image"; exit 1; }
          done
          echo "app present, no inventory"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
