server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # yaml is not in nginx's default mime.types, and the schema files are served
    # for editors that fetch them by URL
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        text/yaml                             yaml yml;
        application/json                      json;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/yaml;

    # NOTHING BELOW MAY MOVE INTO A location BLOCK. add_header is inherited from
    # the enclosing level only if the current level declares no add_header of its
    # own, so a single add_header in a location silently drops every one of these.
    # That is exactly what a `location = /index.html` here used to do: it set a
    # cache header and, as a side effect, served the page with no CSP at all.

    # Revalidate everything, every load. The assets carry no version in their
    # names, because the app has no build step and has to keep working from a
    # file:// URL, so there is nothing to bust a stale copy with. A cached
    # js/core.js paired with a fresh js/app.js is not a cosmetic problem: the two
    # emitters have to agree byte for byte, and a mismatched pair writes YAML
    # that reformats the user's whole file. ETag makes each revalidation a 304 of
    # a few hundred bytes, which is the right price for that.
    add_header Cache-Control "no-cache" always;

    # No external requests are made by the app, so lock it down. 'unsafe-inline'
    # is needed for the inline event wiring and the settings <script> payload.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
