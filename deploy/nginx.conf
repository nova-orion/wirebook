server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # yaml is not in nginx's default mime.types, and the schema files are served
    # for editors that fetch them by URL
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        text/yaml                             yaml yml;
        application/json                      json;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;

    # The app is one page plus a handful of assets; let the browser cache the
    # assets but always re-check the page so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/yaml;

    # No external requests are made by the app, so lock it down. 'unsafe-inline'
    # is needed for the inline event wiring and the settings <script> payload.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
